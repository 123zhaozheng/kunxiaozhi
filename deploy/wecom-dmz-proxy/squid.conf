# LambChat WeCom DMZ forward proxy.
#
# This test configuration accepts clients reaching port 3128, but only permits
# HTTP CONNECT tunnels to the official WeCom WebSocket endpoint on TCP 443.
# Restrict the source network before using it in a real DMZ.

http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443
acl wecom_websocket dstdomain openws.work.weixin.qq.com

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow wecom_websocket
http_access deny all

# Tunnel traffic only; do not cache content.
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

forwarded_for delete
