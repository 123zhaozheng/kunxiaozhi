services:
  wecom-dmz-proxy:
    build:
      context: .
    container_name: lambchat-wecom-dmz-proxy
    restart: unless-stopped
    ports:
      - "${WECOM_PROXY_PORT:-3128}:3128"
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 3128
      interval: 10s
      timeout: 3s
      retries: 3
